<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء الحساب</title>
    <link rel="shortcut icon" href="assets/وجهة-01.png">
    <link rel="stylesheet" href="css/login_register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
</head>
<body>
    <div class="form">
        <div class="btn-back">
            <a href="index.html"><i class="fa-solid fa-circle-left"></i></a>
        </div>
        <form action="">        
            <div class="logo">
                <img src="assets/وجهة-01.png" alt="شعار موقع وجهة">
            </div>
            <div class="form-title"><h2 >إنشاء الحساب</h2></div>
            <div class="user-name inputs-form">
                <label for="user-name">اسم المستخدم </label>
                <input type="text" placeholder="     أدخل اسم المستخدم" name="user-name" required>
            </div>
            <div class="email inputs-form">
                <label for="email">البريد الإلكتروني </label>
                <input type="email" placeholder="     أدخل البريد الإلكتروني" name="email" required >
            </div>
            <div class="password inputs-form">
                <label for="password">كلمة السر </label>
                <input type="password" placeholder="     أدخل كلمة السر" name ="password" required>
            </div>
            <div class="confirm-password inputs-form">
                <label for="confirm-password">تأكيد كلمة السر </label>
                <input type="password" placeholder="     أدخل كلمة السر" name ="confirm-password" required>
            </div>
            
            <div class="button">
                <input type="submit" value="إنشاء حساب">
            </div>
            
            <div class="login">
                <span>لدي حساب بالفعل </span><a href="login.html">تسجيل الدخول</a>
            </div>
        </form>
    </div>
    
</body>
</html>
